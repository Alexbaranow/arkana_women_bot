# Боевой compose на VPS: образ приходит из ghcr.io, на месте не собирается.
# Лежит в /opt/arkana рядом с .env; тег образа задаёт CI через IMAGE_TAG.
services:
  webapp:
    image: ${IMAGE_NAME:-ghcr.io/alexbaranow/arkana_women_bot}:${IMAGE_TAG:-latest}
    container_name: arkana-webapp
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      # Порт на хосте: на сервере несколько ботов, у Arkana по умолчанию 8082.
      - "127.0.0.1:${HOST_PORT:-8082}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
